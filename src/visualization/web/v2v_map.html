<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V2V Live Map</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a1a;
            color: #e0e0e0;
            overflow: hidden;
        }
        
        /* DLR Logo */
        .dlr-logo {
            position: fixed;
            top: 16px;
            right: 16px;
            height: 30px;
            width: auto;
            z-index: 1000;
            opacity: 0.9;
        }

        .map-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* HUD overlay */
        .hud {
            position: absolute;
            top: 16px;
            left: 16px;
            background: rgba(10, 10, 30, 0.85);
            border: 1px solid #334;
            border-radius: 8px;
            padding: 14px 18px;
            font-size: 13px;
            line-height: 1.7;
            min-width: 220px;
            pointer-events: none;
        }

        .hud-title {
            font-size: 15px;
            font-weight: 600;
            color: #667eea;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .hud-row {
            display: flex;
            justify-content: space-between;
        }

        .hud-label { color: #94a3b8; }
        .hud-value { color: #fff; font-weight: 500; }

        /* Legend */
        .legend {
            position: absolute;
            bottom: 16px;
            left: 16px;
            background: rgba(10, 10, 30, 0.85);
            border: 1px solid #334;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 12px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 4px;
        }

        .legend-item:last-child { margin-bottom: 0; }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
            flex-shrink: 0;
        }

        /* Status indicator */
        .status-bar {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(10, 10, 30, 0.85);
            border: 1px solid #334;
            border-radius: 8px;
            padding: 10px 16px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #555;
        }

        .status-dot.connected { background: #4ade80; }
        .status-dot.disconnected { background: #f87171; }

        /* Zoom controls */
        .zoom-controls {
            position: absolute;
            bottom: 16px;
            right: 16px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .zoom-btn {
            width: 36px;
            height: 36px;
            background: rgba(10, 10, 30, 0.85);
            border: 1px solid #334;
            border-radius: 6px;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .zoom-btn:hover { background: rgba(30, 30, 70, 0.9); }
    </style>
</head>
<body>
    <img src="/assets/DLR_KI_Logo_inverted_transparent_v2.png" alt="DLR" class="dlr-logo" title="Deutsches Zentrum für Luft- und Raumfahrt">
    <div class="map-container">
        <canvas id="mapCanvas"></canvas>

        <div class="hud" id="hud">
            <div class="hud-title">V2V Live Map</div>
            <div class="hud-row">
                <span class="hud-label">Ego Speed:</span>
                <span class="hud-value" id="hudSpeed">-- km/h</span>
            </div>
            <div class="hud-row">
                <span class="hud-label">Heading:</span>
                <span class="hud-value" id="hudHeading">--°</span>
            </div>
            <div class="hud-row">
                <span class="hud-label">Position:</span>
                <span class="hud-value" id="hudPosition">--, --</span>
            </div>
            <div class="hud-row">
                <span class="hud-label">Neighbors:</span>
                <span class="hud-value" id="hudNeighbors">0</span>
            </div>
            <div class="hud-row">
                <span class="hud-label">V2V Range:</span>
                <span class="hud-value" id="hudRange">-- m</span>
            </div>
        </div>

        <div class="legend">
            <div class="legend-item">
                <div class="legend-dot" style="background: #667eea;"></div>
                <span>Ego Vehicle</span>
            </div>
            <div class="legend-item">
                <div class="legend-dot" style="background: #4ade80;"></div>
                <span>V2V Neighbor (Safe)</span>
            </div>
            <div class="legend-item">
                <div class="legend-dot" style="background: #fbbf24;"></div>
                <span>V2V Neighbor (Caution)</span>
            </div>
            <div class="legend-item">
                <div class="legend-dot" style="background: #f87171;"></div>
                <span>V2V Neighbor (Threat)</span>
            </div>
            <div class="legend-item">
                <div class="legend-dot" style="background: #64748b; border: 1px dashed #94a3b8;"></div>
                <span>Other Vehicle (No V2V)</span>
            </div>
        </div>

        <div class="status-bar">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText">Connecting...</span>
        </div>

        <div class="zoom-controls">
            <button class="zoom-btn" onclick="zoomIn()" title="Zoom In">+</button>
            <button class="zoom-btn" onclick="zoomOut()" title="Zoom Out">−</button>
            <button class="zoom-btn" onclick="resetView()" title="Reset View" style="font-size: 14px;">⟲</button>
        </div>
    </div>

    <script>
        // ─── Configuration ───────────────────────────────────────────────
        const EGO_VEHICLE_ID = 0;
        const POLL_INTERVAL_MS = 200;   // 5 Hz refresh
        const TRAIL_LENGTH = 200;       // Number of past positions to draw
        const BASE_URL = `http://${window.location.hostname}:${window.location.port || 8000}`;

        // ─── Canvas Setup ────────────────────────────────────────────────
        const canvas = document.getElementById('mapCanvas');
        const ctx = canvas.getContext('2d');
        let dpr = window.devicePixelRatio || 1;

        function resizeCanvas() {
            dpr = window.devicePixelRatio || 1;
            canvas.width = canvas.clientWidth * dpr;
            canvas.height = canvas.clientHeight * dpr;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // ─── View State ─────────────────────────────────────────────────
        let scale = 3.0;           // pixels per meter
        let followEgo = true;      // auto-center on ego
        let panOffsetX = 0;        // manual pan offset
        let panOffsetY = 0;

        // ─── Data State ─────────────────────────────────────────────────
        let egoData = null;
        let neighborsData = [];
        let threatsData = [];
        let networkStats = null;
        let allVehicleIds = [];

        // Trail: array of {x, y} positions for ego vehicle
        let egoTrail = [];

        // Per-neighbor trails: Map<vehicleId, [{x, y}]>
        let neighborTrails = new Map();

        let isConnected = false;

        // ─── Zoom / Pan ─────────────────────────────────────────────────
        function zoomIn() { scale = Math.min(scale * 1.3, 30); }
        function zoomOut() { scale = Math.max(scale / 1.3, 0.3); }
        function resetView() { scale = 3.0; followEgo = true; panOffsetX = 0; panOffsetY = 0; }

        // Mouse wheel zoom
        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            if (e.deltaY < 0) zoomIn(); else zoomOut();
        }, { passive: false });

        // Drag to pan
        let isDragging = false;
        let lastMouseX = 0, lastMouseY = 0;

        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            followEgo = false;  // disable auto-follow on manual pan
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            panOffsetX += (e.clientX - lastMouseX);
            panOffsetY += (e.clientY - lastMouseY);
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
        });

        canvas.addEventListener('mouseup', () => { isDragging = false; });
        canvas.addEventListener('mouseleave', () => { isDragging = false; });

        // Double-click to re-center on ego
        canvas.addEventListener('dblclick', () => {
            followEgo = true;
            panOffsetX = 0;
            panOffsetY = 0;
        });

        // ─── Data Fetching ──────────────────────────────────────────────
        async function fetchData() {
            try {
                // Parallel fetch: ego BSM, neighbors, threats, stats
                const [egoRes, neighborsRes, threatsRes, statsRes] = await Promise.all([
                    fetch(`${BASE_URL}/api/v2v/vehicles/${EGO_VEHICLE_ID}`),
                    fetch(`${BASE_URL}/api/v2v/vehicles/${EGO_VEHICLE_ID}/neighbors`),
                    fetch(`${BASE_URL}/api/v2v/vehicles/${EGO_VEHICLE_ID}/threats`),
                    fetch(`${BASE_URL}/api/v2v/network/stats`)
                ]);

                const ego = await egoRes.json();
                const neighbors = await neighborsRes.json();
                const threats = await threatsRes.json();
                const stats = await statsRes.json();

                if (ego.error) {
                    setStatus(false, 'No V2V data');
                    return;
                }

                egoData = ego;
                neighborsData = Array.isArray(neighbors) ? neighbors : [];
                threatsData = Array.isArray(threats) ? threats : [];
                networkStats = stats;

                // Update ego trail
                if (egoData.position) {
                    egoTrail.push({ x: egoData.position.x, y: egoData.position.y });
                    if (egoTrail.length > TRAIL_LENGTH) egoTrail.shift();
                }

                // Update neighbor trails
                const activeNeighborIds = new Set();
                for (const n of neighborsData) {
                    const nid = n.vehicle_id;
                    activeNeighborIds.add(nid);
                    if (!neighborTrails.has(nid)) neighborTrails.set(nid, []);
                    const trail = neighborTrails.get(nid);
                    trail.push({ x: n.bsm.position.x, y: n.bsm.position.y });
                    if (trail.length > TRAIL_LENGTH) trail.shift();
                }

                // Clean up trails for vehicles no longer neighbors
                for (const [nid] of neighborTrails) {
                    if (!activeNeighborIds.has(nid)) {
                        const trail = neighborTrails.get(nid);
                        // Fade out: remove a few points per tick
                        if (trail.length > 0) {
                            trail.splice(0, 3);
                        }
                        if (trail.length === 0) neighborTrails.delete(nid);
                    }
                }

                setStatus(true, 'Live');
                updateHUD();

            } catch (err) {
                setStatus(false, 'Connection error');
            }
        }

        function setStatus(connected, text) {
            isConnected = connected;
            document.getElementById('statusDot').className = 'status-dot ' + (connected ? 'connected' : 'disconnected');
            document.getElementById('statusText').textContent = text;
        }

        function updateHUD() {
            if (!egoData) return;
            document.getElementById('hudSpeed').textContent =
                (egoData.speed * 3.6).toFixed(1) + ' km/h';
            document.getElementById('hudHeading').textContent =
                egoData.heading.toFixed(1) + '°';
            document.getElementById('hudPosition').textContent =
                egoData.position.x.toFixed(1) + ', ' + egoData.position.y.toFixed(1);
            document.getElementById('hudNeighbors').textContent =
                neighborsData.length.toString();
            if (networkStats && networkStats.max_range_m) {
                document.getElementById('hudRange').textContent =
                    networkStats.max_range_m + ' m';
            }
        }

        // ─── World → Screen Coordinate Transform ───────────────────────
        function worldToScreen(wx, wy) {
            const cw = canvas.clientWidth;
            const ch = canvas.clientHeight;
            let cx = cw / 2;
            let cy = ch / 2;

            if (followEgo && egoData && egoData.position) {
                // Center on ego
                const sx = cx + (wx - egoData.position.x) * scale + panOffsetX;
                const sy = cy + (wy - egoData.position.y) * scale + panOffsetY;
                return [sx, sy];
            } else if (egoData && egoData.position) {
                // Manual pan from last ego center
                const sx = cx + (wx - egoData.position.x) * scale + panOffsetX;
                const sy = cy + (wy - egoData.position.y) * scale + panOffsetY;
                return [sx, sy];
            }

            return [cx + wx * scale, cy + wy * scale];
        }

        // ─── Rendering ──────────────────────────────────────────────────
        function getThreatLevel(vehicleId) {
            const threat = threatsData.find(t => t.other_vehicle_id === vehicleId);
            if (!threat) return 'safe';
            return threat.threat_level || 'safe';
        }

        function getThreatColor(level) {
            switch (level) {
                case 'high':
                case 'critical': return '#f87171';
                case 'medium': return '#fbbf24';
                default: return '#4ade80';
            }
        }

        function drawGrid() {
            const cw = canvas.clientWidth;
            const ch = canvas.clientHeight;

            // Determine grid spacing based on zoom
            let gridSpacing = 10;  // meters
            if (scale < 1) gridSpacing = 50;
            else if (scale < 2) gridSpacing = 25;
            else if (scale > 8) gridSpacing = 5;

            ctx.strokeStyle = 'rgba(100, 116, 139, 0.15)';
            ctx.lineWidth = 0.5;
            ctx.font = '10px monospace';
            ctx.fillStyle = 'rgba(100, 116, 139, 0.4)';

            // Calculate visible world bounds
            const center = egoData ? egoData.position : { x: 0, y: 0 };
            const halfW = cw / (2 * scale);
            const halfH = ch / (2 * scale);

            const startX = Math.floor((center.x - halfW) / gridSpacing) * gridSpacing;
            const endX = Math.ceil((center.x + halfW) / gridSpacing) * gridSpacing;
            const startY = Math.floor((center.y - halfH) / gridSpacing) * gridSpacing;
            const endY = Math.ceil((center.y + halfH) / gridSpacing) * gridSpacing;

            // Vertical lines
            for (let wx = startX; wx <= endX; wx += gridSpacing) {
                const [sx] = worldToScreen(wx, 0);
                ctx.beginPath();
                ctx.moveTo(sx, 0);
                ctx.lineTo(sx, ch);
                ctx.stroke();
                // Label
                ctx.fillText(wx.toFixed(0) + 'm', sx + 3, ch - 4);
            }

            // Horizontal lines
            for (let wy = startY; wy <= endY; wy += gridSpacing) {
                const [, sy] = worldToScreen(0, wy);
                ctx.beginPath();
                ctx.moveTo(0, sy);
                ctx.lineTo(cw, sy);
                ctx.stroke();
                ctx.fillText(wy.toFixed(0) + 'm', 4, sy - 3);
            }
        }

        function drawTrail(trail, color, maxAlpha = 0.6) {
            if (trail.length < 2) return;

            for (let i = 1; i < trail.length; i++) {
                const alpha = (i / trail.length) * maxAlpha;
                const [x1, y1] = worldToScreen(trail[i - 1].x, trail[i - 1].y);
                const [x2, y2] = worldToScreen(trail[i].x, trail[i].y);

                ctx.beginPath();
                ctx.strokeStyle = color.replace(')', `, ${alpha})`).replace('rgb', 'rgba');
                ctx.lineWidth = 2;
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();
            }
        }

        function drawVehicle(wx, wy, heading, color, size, label, isEgo = false) {
            const [sx, sy] = worldToScreen(wx, wy);

            // Vehicle body as a directional triangle
            const len = size * (isEgo ? 1.8 : 1.4);
            const wid = size * (isEgo ? 1.0 : 0.8);
            const angle = heading * Math.PI / 180;  // CARLA heading (0°=+X, 90°=+Y) to canvas angle

            ctx.save();
            ctx.translate(sx, sy);
            ctx.rotate(angle);

            // Glow effect for ego
            if (isEgo) {
                ctx.shadowColor = color;
                ctx.shadowBlur = 18;
            }

            // Triangle body
            ctx.beginPath();
            ctx.moveTo(len, 0);          // nose
            ctx.lineTo(-len * 0.6, -wid);  // rear left
            ctx.lineTo(-len * 0.4, 0);     // rear center indent
            ctx.lineTo(-len * 0.6, wid);   // rear right
            ctx.closePath();

            ctx.fillStyle = color;
            ctx.fill();
            ctx.strokeStyle = 'rgba(255,255,255,0.6)';
            ctx.lineWidth = 1;
            ctx.stroke();

            ctx.shadowBlur = 0;
            ctx.restore();

            // Label
            if (label) {
                ctx.font = '11px "Segoe UI", sans-serif';
                ctx.fillStyle = 'rgba(255,255,255,0.8)';
                ctx.textAlign = 'center';
                ctx.fillText(label, sx, sy - size - 6);
            }
        }

        function drawV2VRange(wx, wy, rangeM) {
            const [sx, sy] = worldToScreen(wx, wy);
            const radiusPx = rangeM * scale;

            ctx.beginPath();
            ctx.arc(sx, sy, radiusPx, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(102, 126, 234, 0.2)';
            ctx.lineWidth = 1;
            ctx.setLineDash([6, 4]);
            ctx.stroke();
            ctx.setLineDash([]);

            // Filled area
            const gradient = ctx.createRadialGradient(sx, sy, 0, sx, sy, radiusPx);
            gradient.addColorStop(0, 'rgba(102, 126, 234, 0.04)');
            gradient.addColorStop(1, 'rgba(102, 126, 234, 0.01)');
            ctx.fillStyle = gradient;
            ctx.fill();
        }

        function drawConnectionLine(x1, y1, x2, y2, color) {
            const [sx1, sy1] = worldToScreen(x1, y1);
            const [sx2, sy2] = worldToScreen(x2, y2);

            ctx.beginPath();
            ctx.moveTo(sx1, sy1);
            ctx.lineTo(sx2, sy2);
            ctx.strokeStyle = color.replace(')', ', 0.3)').replace('rgb', 'rgba');
            ctx.lineWidth = 1;
            ctx.setLineDash([4, 4]);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        function render() {
            const cw = canvas.clientWidth;
            const ch = canvas.clientHeight;

            // Clear
            ctx.fillStyle = '#0a0a1a';
            ctx.fillRect(0, 0, cw, ch);

            if (!egoData || !egoData.position) {
                // No data yet - show waiting message
                ctx.font = '18px "Segoe UI", sans-serif';
                ctx.fillStyle = '#667eea';
                ctx.textAlign = 'center';
                ctx.fillText('Waiting for V2V data...', cw / 2, ch / 2);
                ctx.font = '13px "Segoe UI", sans-serif';
                ctx.fillStyle = '#94a3b8';
                ctx.fillText('Start a simulation to see the live map', cw / 2, ch / 2 + 28);
                requestAnimationFrame(render);
                return;
            }

            // Grid
            drawGrid();

            // V2V communication range circle
            const v2vRange = networkStats ? networkStats.max_range_m : 75;
            drawV2VRange(egoData.position.x, egoData.position.y, v2vRange);

            // Ego trail
            drawTrail(egoTrail, 'rgb(102, 126, 234)');

            // Neighbor trails and connection lines
            for (const n of neighborsData) {
                const threatLevel = getThreatLevel(n.vehicle_id);
                const color = getThreatColor(threatLevel);

                // Trail
                const trail = neighborTrails.get(n.vehicle_id);
                if (trail) drawTrail(trail, color, 0.4);

                // Connection line from ego to neighbor
                drawConnectionLine(
                    egoData.position.x, egoData.position.y,
                    n.bsm.position.x, n.bsm.position.y,
                    color
                );

                // Distance label on connection
                const [mx, my] = worldToScreen(
                    (egoData.position.x + n.bsm.position.x) / 2,
                    (egoData.position.y + n.bsm.position.y) / 2
                );
                ctx.font = '10px monospace';
                ctx.fillStyle = 'rgba(255,255,255,0.5)';
                ctx.textAlign = 'center';
                ctx.fillText(n.distance.toFixed(1) + 'm', mx, my - 5);

                // Draw neighbor vehicle
                drawVehicle(
                    n.bsm.position.x, n.bsm.position.y,
                    n.bsm.heading,
                    color,
                    8,
                    `V${n.vehicle_id} ${(n.bsm.speed * 3.6).toFixed(0)}km/h`
                );
            }

            // Draw ego vehicle last (on top)
            drawVehicle(
                egoData.position.x, egoData.position.y,
                egoData.heading,
                '#667eea',
                10,
                `EGO ${(egoData.speed * 3.6).toFixed(0)}km/h`,
                true
            );

            // North indicator
            ctx.save();
            ctx.font = 'bold 14px "Segoe UI", sans-serif';
            ctx.fillStyle = '#94a3b8';
            ctx.textAlign = 'center';
            ctx.fillText('N ↑', cw - 30, 50);
            ctx.restore();

            // Scale bar
            const scaleBarM = scale > 5 ? 10 : (scale > 2 ? 25 : 50);
            const scaleBarPx = scaleBarM * scale;
            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(cw - 20 - scaleBarPx, ch - 40);
            ctx.lineTo(cw - 20, ch - 40);
            ctx.stroke();
            // Endcaps
            ctx.beginPath();
            ctx.moveTo(cw - 20 - scaleBarPx, ch - 44);
            ctx.lineTo(cw - 20 - scaleBarPx, ch - 36);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(cw - 20, ch - 44);
            ctx.lineTo(cw - 20, ch - 36);
            ctx.stroke();
            ctx.font = '11px monospace';
            ctx.fillStyle = '#94a3b8';
            ctx.textAlign = 'center';
            ctx.fillText(scaleBarM + 'm', cw - 20 - scaleBarPx / 2, ch - 48);

            requestAnimationFrame(render);
        }

        // ─── Main Loop ──────────────────────────────────────────────────
        setInterval(fetchData, POLL_INTERVAL_MS);
        fetchData();
        requestAnimationFrame(render);

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === '+' || e.key === '=') zoomIn();
            if (e.key === '-') zoomOut();
            if (e.key === 'r' || e.key === 'R') resetView();
            if (e.key === 'f' || e.key === 'F') { followEgo = true; panOffsetX = 0; panOffsetY = 0; }
        });
    </script>
</body>
</html>
