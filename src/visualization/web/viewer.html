<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V2V LiDAR Visualizer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a1a;
            color: #ffffff;
            overflow: hidden;
        }
        
        #container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        
        #canvas-container {
            width: 100%;
            height: 100%;
        }
        
        #info-panel {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            min-width: 250px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        #info-panel h2 {
            margin-bottom: 10px;
            color: #4CAF50;
            font-size: 18px;
        }
        
        #info-panel .stat {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        #info-panel .stat:last-child {
            border-bottom: none;
        }
        
        #info-panel .stat-label {
            color: #aaa;
        }
        
        #info-panel .stat-value {
            color: #fff;
            font-weight: bold;
        }
        
        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 5px;
        }
        
        .status-connected {
            background-color: #4CAF50;
            box-shadow: 0 0 10px #4CAF50;
        }
        
        .status-disconnected {
            background-color: #f44336;
        }
        
        #legend {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        #legend h3 {
            margin-bottom: 10px;
            font-size: 16px;
            color: #4CAF50;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            margin: 5px 0;
            font-size: 12px;
        }
        
        .legend-color {
            width: 20px;
            height: 20px;
            margin-right: 10px;
            border-radius: 3px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        #controls {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        #controls h3 {
            margin-bottom: 10px;
            font-size: 16px;
            color: #4CAF50;
        }
        
        #controls button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px 0;
            width: 100%;
            font-size: 14px;
        }
        
        #controls button:hover {
            background: #45a049;
        }
        
        #controls button:active {
            background: #3d8b40;
        }
        
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            color: #4CAF50;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="canvas-container"></div>
        
        <div id="info-panel">
            <h2>
                <span class="status-indicator" id="status-indicator"></span>
                V2V LiDAR Stream
            </h2>
            <div class="stat">
                <span class="stat-label">Points:</span>
                <span class="stat-value" id="point-count">0</span>
            </div>
            <div class="stat">
                <span class="stat-label">Vehicles:</span>
                <span class="stat-value" id="vehicle-count">0</span>
            </div>
            <div class="stat">
                <span class="stat-label">FPS:</span>
                <span class="stat-value" id="fps">0</span>
            </div>
            <div class="stat">
                <span class="stat-label">Latency:</span>
                <span class="stat-value" id="latency">0 ms</span>
            </div>
        </div>
        
        <div id="legend">
            <h3>Distance Gradient</h3>
            <canvas id="gradient-canvas" width="160" height="20" style="border-radius:3px;display:block;margin-bottom:6px;"></canvas>
            <div style="display:flex;justify-content:space-between;font-size:11px;color:#aaa;">
                <span>0 m (close)</span><span>100 m (far)</span>
            </div>
        </div>
        
        <div id="controls">
            <h3>Controls</h3>
            <button onclick="resetCamera()">Reset Camera</button>
            <button id="follow-btn" onclick="toggleFollowMode()">Enable Follow</button>
            <button id="freefly-btn" onclick="toggleFreeFly()">Enable Free-Fly</button>
            <button id="size-btn" onclick="togglePointSize()">Point Size: 0.5</button>
            <button id="color-btn" onclick="cycleColorMode()">Color: Distance</button>
            <button onclick="toggleGrid()">Toggle Grid</button>
        </div>
        
        <div class="loading" id="loading">Connecting...</div>
    </div>
    
    <!-- Three.js and OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
    
    <script>
        // ── Binary protocol constants (must match src/utils/binary_protocol.py V2) ──
        // Header layout (28 bytes, little-endian):
        //   0-3   magic 'LIDR'
        //   4-5   version (uint16)
        //   6-7   flags   (uint16)  bit 0 = zlib-compressed (not used in JS path)
        //   8-15  timestamp (float64)
        //   16-19 num_points (uint32)
        //   20-23 num_vehicles (uint32)
        //   24-27 ego_actor_id (uint32)
        // Transform (24 bytes, float32 × 6): x, y, z, yaw, pitch, roll
        // Points (num_points × 20 bytes, float32 × 5): x, y, z, tag, object_idx
        const BINARY_HEADER_SIZE    = 28;
        const BINARY_TRANSFORM_SIZE = 24;
        const BINARY_POINT_STRIDE   = 5;   // floats per point
        const BINARY_POINTS_OFFSET  = BINARY_HEADER_SIZE + BINARY_TRANSFORM_SIZE; // 52

        // ── CARLA Semantic Tag Colors (complete set, tags 0-28) ──────────────────
        // Source: https://carla.readthedocs.io/en/latest/ref_sensors/#semantic-segmentation-camera
        const SEMANTIC_COLORS = {
            0:  0x808080,  // Unlabeled
            1:  0x596275,  // Building
            2:  0xCC3311,  // Fence
            3:  0x7B2D8B,  // Other
            4:  0xFF69B4,  // Pedestrian
            5:  0x40E0D0,  // Pole
            6:  0xFFFFFF,  // RoadLine
            7:  0x808080,  // Road (same gray family as unlabeled, slightly darker below)
            8:  0xC8A882,  // Sidewalk
            9:  0x228B22,  // Vegetation
            10: 0x4169E1,  // Vehicle  (Royal Blue — keep distinctive)
            11: 0xDDDDDD,  // Wall
            12: 0xFFD700,  // TrafficSign
            13: 0x87CEEB,  // Sky
            14: 0x8B4513,  // Ground
            15: 0xFF8C00,  // Bridge
            16: 0x9370DB,  // RailTrack
            17: 0x3CB371,  // GuardRail
            18: 0xFFFF00,  // TrafficLight
            19: 0xB8860B,  // Static
            20: 0x00CED1,  // Dynamic
            21: 0x1E90FF,  // Water
            22: 0xA0785A,  // Terrain
            // Tags 23-28 are present in some CARLA builds
            23: 0xFF6347,  // Any
            24: 0x20B2AA,  // Any
            25: 0xDA70D6,  // Any
            26: 0xF0E68C,  // Any
            27: 0x00FA9A,  // Any
            28: 0xFF4500,  // Any
        };
        // Fix Road vs Unlabeled contrast (Road = darker gray)
        SEMANTIC_COLORS[7] = 0x555555;

        // ── Viridis colormap (distance gradient) ─────────────────────────────────
        // 32 perceptually-uniform control points sampled from the Viridis LUT.
        // Close = purple, mid = teal/green, far = yellow.
        const VIRIDIS_LUT = [
            [0.267, 0.005, 0.329], [0.283, 0.141, 0.458], [0.253, 0.266, 0.530],
            [0.207, 0.372, 0.553], [0.164, 0.471, 0.558], [0.128, 0.566, 0.551],
            [0.134, 0.659, 0.518], [0.267, 0.749, 0.441], [0.477, 0.821, 0.318],
            [0.741, 0.873, 0.150], [0.993, 0.906, 0.144],
        ];
        function viridisColor(t) {
            t = Math.max(0.0, Math.min(1.0, t));
            const idx = t * (VIRIDIS_LUT.length - 1);
            const i   = Math.floor(idx);
            const f   = idx - i;
            if (i >= VIRIDIS_LUT.length - 1) return VIRIDIS_LUT[VIRIDIS_LUT.length - 1];
            const c0 = VIRIDIS_LUT[i], c1 = VIRIDIS_LUT[i + 1];
            return [c0[0] + f*(c1[0]-c0[0]), c0[1] + f*(c1[1]-c0[1]), c0[2] + f*(c1[2]-c0[2])];
        }

        // ── Color mode state ──────────────────────────────────────────────────────
        // 'distance'  — Viridis gradient (purple=close → yellow=far)  [default]
        // 'semantic'  — CARLA semantic tags
        // 'height'    — Z-value gradient (blue=low → orange=high)
        let colorMode = 'distance';
        const LIDAR_MAX_RANGE = 100.0;  // metres — matches sensor 'range' config
        // egoPosition is kept in world coords; distance is computed relative to it

        function heightColor(z) {
            // z roughly in [-2, 5] for typical road scenes; map to [0,1]
            const t = Math.max(0, Math.min(1, (z + 2.0) / 7.0));
            // Blue(low) → Cyan → Green → Yellow → Orange(high)
            const stops = [
                [0.0, 0.0, 0.8], [0.0, 0.8, 0.8], [0.0, 0.8, 0.0],
                [0.8, 0.8, 0.0], [0.9, 0.4, 0.0],
            ];
            const idx = t * (stops.length - 1);
            const i   = Math.floor(idx);
            const f   = idx - i;
            if (i >= stops.length - 1) return stops[stops.length - 1];
            const c0 = stops[i], c1 = stops[i + 1];
            return [c0[0] + f*(c1[0]-c0[0]), c0[1] + f*(c1[1]-c0[1]), c0[2] + f*(c1[2]-c0[2])];
        }

        // Scene setup
        let scene, camera, renderer;
        let orbitControls;
        let pointerControls;
        let pointCloud, gridHelper;
        let ws;
        let frameCount = 0;
        let lastFrameTime = Date.now();
        let lastDataTime = Date.now();
        let pointSize = 0.5;
        let showGrid = true;
        let followMode = false;
        let freeFlyMode = false;
        let egoPosition = { x: 0, y: 0, z: 0 };
        let egoActorId = 0;   // updated from binary header for ego self-filtering
        
        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a1a);
            scene.fog = new THREE.Fog(0x1a1a1a, 50, 200);
            
            // Camera (CARLA uses Z-up, X-forward coordinate system)
            camera = new THREE.PerspectiveCamera(
                75,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );
            camera.position.set(-25, 0, 20);  // Behind and above for better view
            camera.up.set(0, 0, 1);  // Z-up for CARLA
            
            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('canvas-container').appendChild(renderer.domElement);
            
            // Dual control system: FlyControls for free movement OR follow mode
            // Use PointerLockControls for FPS-style free movement
            pointerControls = new THREE.PointerLockControls(camera, renderer.domElement);
            
            // OrbitControls as fallback (when not in free-fly mode)
            orbitControls = new THREE.OrbitControls(camera, renderer.domElement);
            orbitControls.enableDamping = true;
            orbitControls.dampingFactor = 0.05;
            orbitControls.screenSpacePanning = false;
            orbitControls.maxPolarAngle = Math.PI;
            orbitControls.enabled = true;  // Start with orbit controls
            
            // Movement state for free-fly mode
            const moveState = {
                forward: false,
                backward: false,
                left: false,
                right: false,
                up: false,
                down: false,
                speed: 0.5
            };
            
            // Grid helper (XY plane since Z is up)
            gridHelper = new THREE.GridHelper(100, 50, 0x444444, 0x222222);
            gridHelper.rotation.x = Math.PI / 2;  // Rotate to XY plane
            scene.add(gridHelper);
            
            // Coordinate axes
            const axesHelper = new THREE.AxesHelper(10);
            scene.add(axesHelper);
            
            // Ambient light
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);
            
            // Directional light
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
            directionalLight.position.set(10, 10, 20);
            scene.add(directionalLight);
            
            // Initialize point cloud with better visibility settings
            const geometry = new THREE.BufferGeometry();
            const material = new THREE.PointsMaterial({
                size: pointSize,
                vertexColors: true,
                sizeAttenuation: true,  // Points get smaller with distance (realistic)
                transparent: false,
                opacity: 1.0,
                depthTest: true,
                depthWrite: true
            });
            pointCloud = new THREE.Points(geometry, material);
            scene.add(pointCloud);
            
            // Setup keyboard controls for free-fly mode
            setupKeyboardControls(moveState);
            
            // Setup pointer lock for free-fly mode
            setupPointerLock(pointerControls, moveState);
            
            // Handle window resize
            window.addEventListener('resize', onWindowResize, false);
            
            // Connect WebSocket
            connectWebSocket();
            
            // Start animation loop
            animate();
        }
        
        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws`;
            
            ws = new WebSocket(wsUrl);
            // Force binary data as ArrayBuffer (not Blob) for all browsers
            ws.binaryType = 'arraybuffer';
            
            ws.onopen = () => {
                console.log('WebSocket connected');
                document.getElementById('status-indicator').className = 'status-indicator status-connected';
                const loadingEl = document.getElementById('loading');
                loadingEl.textContent = 'Connected - Waiting for simulation...';
                loadingEl.style.color = '#4CAF50';
            };
            
            ws.onmessage = (event) => {
                try {
                    if (event.data instanceof ArrayBuffer) {
                        // Binary point-cloud frame
                        document.getElementById('loading').style.display = 'none';
                        const parsed = decodeBinaryPointCloud(event.data);
                        if (parsed) {
                            updatePointCloudFromBinary(parsed);
                            updateStats({ num_points: parsed.numPoints, num_vehicles: parsed.numVehicles });
                        }
                        lastDataTime = Date.now();
                        return;
                    }

                    // Text: status or JSON fallback
                    const data = JSON.parse(event.data);
                    if (data.type === 'status') {
                        handleStatusMessage(data);
                        return;
                    }
                    // JSON fallback (server without BinaryProtocol)
                    if (data.type === 'pointcloud' || data.points) {
                        document.getElementById('loading').style.display = 'none';
                        updatePointCloud(data);
                        updateStats(data);
                        lastDataTime = Date.now();
                    }
                } catch (e) {
                    console.error('Error processing WebSocket message:', e);
                }
            };
            
            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
                document.getElementById('status-indicator').className = 'status-indicator status-disconnected';
            };
            
            ws.onclose = () => {
                console.log('WebSocket disconnected');
                document.getElementById('status-indicator').className = 'status-indicator status-disconnected';
                document.getElementById('loading').style.display = 'block';
                document.getElementById('loading').textContent = 'Reconnecting...';
                document.getElementById('loading').style.color = '#f44336';
                setTimeout(connectWebSocket, 2000);
            };
        }

        // ── Binary decoder ────────────────────────────────────────────────────────
        function decodeBinaryPointCloud(buffer) {
            if (buffer.byteLength < BINARY_POINTS_OFFSET) return null;

            const view = new DataView(buffer);
            // Validate magic 'LIDR' = 0x4C494452
            if (view.getUint32(0, true) !== 0x5244494C) return null;  // little-endian 'LIDR'

            const numPoints    = view.getUint32(16, true);
            const numVehicles  = view.getUint32(20, true);
            const actorId      = view.getUint32(24, true);

            // Ego transform (6 × float32 at offset 28)
            const ex    = view.getFloat32(28, true);
            const ey    = view.getFloat32(32, true);
            const ez    = view.getFloat32(36, true);
            const eyaw  = view.getFloat32(40, true);

            const expectedBytes = BINARY_POINTS_OFFSET + numPoints * BINARY_POINT_STRIDE * 4;
            if (buffer.byteLength < expectedBytes) return null;

            // Point data as a flat Float32Array view — no copy
            const points = new Float32Array(buffer, BINARY_POINTS_OFFSET, numPoints * BINARY_POINT_STRIDE);

            return { numPoints, numVehicles, actorId, ex, ey, ez, eyaw, points };
        }

        // ── Update scene from binary frame ────────────────────────────────────────
        function updatePointCloudFromBinary(parsed) {
            const { numPoints, numVehicles, actorId, ex, ey, ez, eyaw, points } = parsed;

            egoActorId    = actorId;
            egoPosition.x = ex;
            egoPosition.y = ey;
            egoPosition.z = ez;

            if (followMode) _updateFollowCamera(ex, ey, ez, eyaw);

            const positions = new Float32Array(numPoints * 3);
            const colors    = new Float32Array(numPoints * 3);
            let write = 0;

            for (let i = 0; i < numPoints; i++) {
                const base = i * BINARY_POINT_STRIDE;
                const px  = points[base];
                const py  = points[base + 1];
                const pz  = points[base + 2];
                const tag = points[base + 3];
                const idx = points[base + 4];

                // Ego self-hit filtering: skip points that hit the ego car body
                if (actorId !== 0 && idx === actorId) continue;

                positions[write * 3]     = px;
                positions[write * 3 + 1] = -py;   // CARLA Y-right → Three.js Y-left
                positions[write * 3 + 2] = pz;

                let r, g, b;
                if (colorMode === 'distance') {
                    // Points are ego-relative (Python subtracts sensor pos before encoding),
                    // so distance from sensor = sqrt(px²+py²+pz²) exactly.
                    const dist = Math.sqrt(px*px + py*py + pz*pz);
                    const [vr, vg, vb] = viridisColor(dist / LIDAR_MAX_RANGE);
                    r = vr; g = vg; b = vb;
                } else if (colorMode === 'height') {
                    const [hr, hg, hb] = heightColor(pz);
                    r = hr; g = hg; b = hb;
                } else {
                    // semantic
                    const hex = SEMANTIC_COLORS[tag | 0] !== undefined
                        ? SEMANTIC_COLORS[tag | 0] : 0x808080;
                    r = ((hex >> 16) & 0xFF) / 255;
                    g = ((hex >>  8) & 0xFF) / 255;
                    b = ( hex        & 0xFF) / 255;
                }

                colors[write * 3]     = r;
                colors[write * 3 + 1] = g;
                colors[write * 3 + 2] = b;
                write++;
            }

            // Slice to actual written count (some ego points were skipped)
            const posSlice = positions.slice(0, write * 3);
            const colSlice = colors.slice(0, write * 3);

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(posSlice, 3));
            geometry.setAttribute('color',    new THREE.BufferAttribute(colSlice, 3));
            geometry.computeBoundingSphere();

            pointCloud.geometry.dispose();
            pointCloud.geometry = geometry;
        }
        
        function handleStatusMessage(data) {
            const loadingEl = document.getElementById('loading');
            loadingEl.style.display = 'block';
            
            switch (data.status) {
                case 'waiting':
                    loadingEl.textContent = data.message || 'Waiting for simulation...';
                    loadingEl.style.color = '#FFA500';  // Orange for waiting
                    break;
                case 'waiting_data':
                    loadingEl.textContent = data.message || 'Collector ready, waiting for data...';
                    loadingEl.style.color = '#90EE90';  // Light green - almost there
                    break;
                case 'streaming':
                    loadingEl.style.display = 'none';  // Hide when streaming
                    break;
                default:
                    loadingEl.textContent = data.message || 'Status: ' + data.status;
                    loadingEl.style.color = '#4CAF50';
            }
            console.log('Server status:', data.status, data.message);
        }
        
        function _updateFollowCamera(x, y, z, yawDeg) {
            let forwardX = -50, forwardY = 0;
            if (yawDeg !== undefined) {
                const yawRad = yawDeg * Math.PI / 180;
                forwardX = -50 * Math.cos(yawRad);
                forwardY = -50 * Math.sin(yawRad);
            }
            const targetCamPos = new THREE.Vector3(x + forwardX, -(y + forwardY), z + 40);
            const targetLookAt = new THREE.Vector3(x, -y, z);
            camera.position.lerp(targetCamPos, 0.1);
            const currentLookAt = new THREE.Vector3();
            camera.getWorldDirection(currentLookAt);
            currentLookAt.multiplyScalar(100).add(camera.position);
            currentLookAt.lerp(targetLookAt, 0.15);
            camera.lookAt(currentLookAt);
        }

        function updatePointCloud(data) {
            // JSON fallback path (server without BinaryProtocol).
            if (!data.points || data.num_points === 0) return;

            const n = data.num_points;
            const positions = new Float32Array(n * 3);
            const colors    = new Float32Array(n * 3);

            if (data.ego_transform) {
                egoPosition.x = data.ego_transform.x;
                egoPosition.y = data.ego_transform.y;
                egoPosition.z = data.ego_transform.z;
                if (followMode) {
                    _updateFollowCamera(
                        egoPosition.x, egoPosition.y, egoPosition.z,
                        data.ego_transform.yaw
                    );
                }
            }

            let write = 0;
            for (let i = 0; i < n; i++) {
                const px  = data.points.x[i];
                const py  = data.points.y[i];
                const pz  = data.points.z[i];
                const tag = data.points.tag[i];
                const idx = data.points.idx ? data.points.idx[i] : -1;

                if (egoActorId !== 0 && idx === egoActorId) continue;

                positions[write * 3]     = px;
                positions[write * 3 + 1] = -py;
                positions[write * 3 + 2] = pz;

                let r, g, b;
                if (colorMode === 'distance') {
                    const dx = px - egoPosition.x, dy = py - egoPosition.y, dz = pz - egoPosition.z;
                    const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);
                    const [vr, vg, vb] = viridisColor(dist / LIDAR_MAX_RANGE);
                    r = vr; g = vg; b = vb;
                } else if (colorMode === 'height') {
                    const [hr, hg, hb] = heightColor(pz);
                    r = hr; g = hg; b = hb;
                } else {
                    const hex = SEMANTIC_COLORS[tag] !== undefined ? SEMANTIC_COLORS[tag] : 0x808080;
                    r = ((hex >> 16) & 0xFF) / 255;
                    g = ((hex >>  8) & 0xFF) / 255;
                    b = ( hex        & 0xFF) / 255;
                }

                colors[write * 3]     = r;
                colors[write * 3 + 1] = g;
                colors[write * 3 + 2] = b;
                write++;
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions.slice(0, write*3), 3));
            geometry.setAttribute('color',    new THREE.BufferAttribute(colors.slice(0, write*3), 3));
            geometry.computeBoundingSphere();

            pointCloud.geometry.dispose();
            pointCloud.geometry = geometry;
        }
        
        function updateStats(data) {
            document.getElementById('point-count').textContent = data.num_points.toLocaleString();
            document.getElementById('vehicle-count').textContent = data.num_vehicles;
            
            const latency = Date.now() - lastDataTime;
            document.getElementById('latency').textContent = `${latency} ms`;
        }
        
        function animate() {
            requestAnimationFrame(animate);
            
            // Update appropriate controls based on mode
            if (freeFlyMode && pointerControls.isLocked) {
                updateFreeFlyMovement(moveState);
            } else if (!freeFlyMode && !followMode) {
                orbitControls.update();
            }
            // Follow mode updates are handled in updatePointCloud
            
            renderer.render(scene, camera);
            
            // Calculate FPS
            frameCount++;
            const now = Date.now();
            if (now - lastFrameTime >= 1000) {
                const fps = Math.round((frameCount * 1000) / (now - lastFrameTime));
                document.getElementById('fps').textContent = fps;
                frameCount = 0;
                lastFrameTime = now;
            }
        }
        
        function setupKeyboardControls(moveState) {
            // Keyboard controls for free-fly mode
            document.addEventListener('keydown', (event) => {
                switch(event.code) {
                    case 'KeyW': moveState.forward = true; break;
                    case 'KeyS': moveState.backward = true; break;
                    case 'KeyA': moveState.left = true; break;
                    case 'KeyD': moveState.right = true; break;
                    case 'Space': moveState.up = true; event.preventDefault(); break;
                    case 'ShiftLeft': moveState.down = true; break;
                    case 'Escape': exitFreeFly(); break;
                }
            });
            
            document.addEventListener('keyup', (event) => {
                switch(event.code) {
                    case 'KeyW': moveState.forward = false; break;
                    case 'KeyS': moveState.backward = false; break;
                    case 'KeyA': moveState.left = false; break;
                    case 'KeyD': moveState.right = false; break;
                    case 'Space': moveState.up = false; break;
                    case 'ShiftLeft': moveState.down = false; break;
                }
            });
        }
        
        function toggleFollowMode() {
            followMode = !followMode;
            
            if (followMode) {
                // Disable other modes
                freeFlyMode = false;
                orbitControls.enabled = false;
                if (pointerControls.isLocked) pointerControls.unlock();
            } else {
                orbitControls.enabled = true;
            }
            
            updateControlButtons();
        }
        
        function toggleFreeFly() {
            freeFlyMode = !freeFlyMode;
            
            if (freeFlyMode) {
                // Disable other modes
                followMode = false;
                orbitControls.enabled = false;
                console.log('Free-fly mode enabled. Click canvas and use WASD + mouse to fly around.');
            } else {
                orbitControls.enabled = true;
                if (pointerControls.isLocked) pointerControls.unlock();
            }
            
            updateControlButtons();
        }
        
        function updateControlButtons() {
            const followBtn = document.getElementById('follow-btn');
            const freeFlyBtn = document.getElementById('freefly-btn');
            
            followBtn.textContent = followMode ? 'Disable Follow' : 'Enable Follow';
            followBtn.style.backgroundColor = followMode ? '#f44336' : '#4CAF50';
            
            freeFlyBtn.textContent = freeFlyMode ? 'Disable Free-Fly' : 'Enable Free-Fly';
            freeFlyBtn.style.backgroundColor = freeFlyMode ? '#f44336' : '#4CAF50';
        }
        
        function togglePointSize() {
            // Cycle: 0.5 → 1.0 → 2.0 → 0.5
            if (pointSize < 0.75) {
                pointSize = 1.0;
            } else if (pointSize < 1.5) {
                pointSize = 2.0;
            } else {
                pointSize = 0.5;
            }
            pointCloud.material.size = pointSize;
            document.getElementById('size-btn').textContent = `Point Size: ${pointSize.toFixed(1)}`;
        }

        function cycleColorMode() {
            const modes = ['distance', 'semantic', 'height'];
            const next  = modes[(modes.indexOf(colorMode) + 1) % modes.length];
            colorMode = next;
            const labels = { distance: 'Color: Distance', semantic: 'Color: Semantic', height: 'Color: Height' };
            document.getElementById('color-btn').textContent = labels[colorMode];
            updateLegend();
        }

        function updateLegend() {
            const legendEl = document.getElementById('legend');
            if (colorMode === 'distance') {
                legendEl.innerHTML = `
                    <h3>Distance Gradient</h3>
                    <canvas id="gradient-canvas" width="160" height="20" style="border-radius:3px;display:block;margin-bottom:6px;"></canvas>
                    <div style="display:flex;justify-content:space-between;font-size:11px;color:#aaa;">
                        <span>0 m (close)</span><span>${LIDAR_MAX_RANGE} m (far)</span>
                    </div>`;
                // Draw Viridis gradient strip
                requestAnimationFrame(() => {
                    const cv = document.getElementById('gradient-canvas');
                    if (!cv) return;
                    const ctx = cv.getContext('2d');
                    for (let x = 0; x < cv.width; x++) {
                        const [r, g, b] = viridisColor(x / (cv.width - 1));
                        ctx.fillStyle = `rgb(${Math.round(r*255)},${Math.round(g*255)},${Math.round(b*255)})`;
                        ctx.fillRect(x, 0, 1, cv.height);
                    }
                });
            } else if (colorMode === 'height') {
                legendEl.innerHTML = `
                    <h3>Height Gradient</h3>
                    <canvas id="gradient-canvas" width="160" height="20" style="border-radius:3px;display:block;margin-bottom:6px;"></canvas>
                    <div style="display:flex;justify-content:space-between;font-size:11px;color:#aaa;">
                        <span>low</span><span>high</span>
                    </div>`;
                requestAnimationFrame(() => {
                    const cv = document.getElementById('gradient-canvas');
                    if (!cv) return;
                    const ctx = cv.getContext('2d');
                    for (let x = 0; x < cv.width; x++) {
                        const [r, g, b] = heightColor((x / cv.width) * 7.0 - 2.0);
                        ctx.fillStyle = `rgb(${Math.round(r*255)},${Math.round(g*255)},${Math.round(b*255)})`;
                        ctx.fillRect(x, 0, 1, cv.height);
                    }
                });
            } else {
                legendEl.innerHTML = `
                    <h3>Semantic Labels</h3>
                    <div class="legend-item"><div class="legend-color" style="background:#808080;"></div><span>Unlabeled (0)</span></div>
                    <div class="legend-item"><div class="legend-color" style="background:#596275;"></div><span>Building (1)</span></div>
                    <div class="legend-item"><div class="legend-color" style="background:#CC3311;"></div><span>Fence (2)</span></div>
                    <div class="legend-item"><div class="legend-color" style="background:#FF69B4;"></div><span>Pedestrian (4)</span></div>
                    <div class="legend-item"><div class="legend-color" style="background:#555555;"></div><span>Road (7)</span></div>
                    <div class="legend-item"><div class="legend-color" style="background:#228B22;"></div><span>Vegetation (9)</span></div>
                    <div class="legend-item"><div class="legend-color" style="background:#4169E1;"></div><span>Vehicle (10)</span></div>
                    <div class="legend-item"><div class="legend-color" style="background:#FFD700;"></div><span>TrafficSign (12)</span></div>
                    <div class="legend-item"><div class="legend-color" style="background:#FFFF00;"></div><span>TrafficLight (18)</span></div>`;
            }
        }
        
        function setupPointerLock(controls, moveState) {
            // Click to lock pointer in free-fly mode
            renderer.domElement.addEventListener('click', () => {
                if (freeFlyMode && !controls.isLocked) {
                    controls.lock();
                }
            });
            
            controls.addEventListener('lock', () => {
                console.log('Pointer locked - Use WASD to move, Space/Shift for up/down, ESC to exit');
            });
            
            controls.addEventListener('unlock', () => {
                console.log('Pointer unlocked');
            });
        }
        
        function updateFreeFlyMovement(moveState) {
            const direction = new THREE.Vector3();
            const right = new THREE.Vector3();
            
            camera.getWorldDirection(direction);
            right.crossVectors(camera.up, direction).normalize();
            
            const velocity = new THREE.Vector3();
            
            if (moveState.forward) velocity.add(direction.multiplyScalar(moveState.speed));
            if (moveState.backward) velocity.add(direction.multiplyScalar(-moveState.speed));
            if (moveState.right) velocity.add(right.multiplyScalar(-moveState.speed));
            if (moveState.left) velocity.add(right.multiplyScalar(moveState.speed));
            if (moveState.up) velocity.z += moveState.speed;
            if (moveState.down) velocity.z -= moveState.speed;
            
            camera.position.add(velocity);
        }
        
        function exitFreeFly() {
            if (pointerControls.isLocked) {
                pointerControls.unlock();
            }
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        function resetCamera() {
            camera.position.set(-25, 0, 20);
            if (orbitControls) {
                orbitControls.target.set(0, 0, 0);
                orbitControls.update();
            }
        }
        
        function toggleGrid() {
            showGrid = !showGrid;
            gridHelper.visible = showGrid;
        }
        
        // Initialize when page loads
        window.addEventListener('load', () => { init(); updateLegend(); });
    </script>
</body>
</html>
