<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CARLA — Live Viewer</title>
<style>
  :root {
    --bg: #0f1117; --surface: #1a1d27; --border: #2d3148;
    --accent: #4f8ef7; --danger: #e05252; --success: #4caf77;
    --warn: #f0a830; --text: #e0e4f0; --muted: #6b7280;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif;
         font-size: 14px; min-height: 100vh; }
  header { background: var(--surface); border-bottom: 1px solid var(--border);
           padding: 12px 22px; display: flex; align-items: center; gap: 14px; }
  header h1 { font-size: 16px; font-weight: 600; }
  .badge { padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; }
  .badge-ok  { background:#1a3d2a; color:var(--success); }
  .badge-err { background:#3d1a1a; color:var(--danger); }
  .badge-warn{ background:#3d2e0a; color:var(--warn); }
  main { display: grid; grid-template-columns: 280px 1fr; height: calc(100vh - 47px); }
  @media (max-width: 700px) { main { grid-template-columns: 1fr; } }
  aside { background: var(--surface); border-right: 1px solid var(--border); overflow-y: auto; padding: 16px; }
  aside h2 { font-size: 11px; font-weight: 600; text-transform: uppercase;
             letter-spacing:.06em; color: var(--muted); margin-bottom: 10px; }
  .veh-item { background: var(--bg); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
  .veh-id { font-size: 11px; color: var(--muted); }
  .veh-speed { font-size: 18px; font-weight: 700; }
  .veh-pos { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .veh-label { display: inline-block; padding: 2px 7px; border-radius: 10px; font-size: 10px;
               font-weight: 600; text-transform: uppercase; letter-spacing:.04em; }
  .label-client { background:#1a2d4a; color:var(--accent); }
  .label-bg { background:#222; color:var(--muted); }
  #mapCanvas { display: block; width: 100%; height: 100%; background: #0a0d14; }
  .stats-bar { grid-column: 1/-1; background: var(--surface); border-top: 1px solid var(--border);
               padding: 8px 22px; display: flex; gap: 24px; font-size: 12px; color: var(--muted); }
  .stats-bar span { color: var(--text); font-weight: 600; margin-left: 5px; }
</style>
</head>
<body>

<header>
  <h1>CARLA Live Viewer</h1>
  <span id="worldBadge" class="badge badge-warn">Connecting…</span>
  <span style="margin-left:auto; color:var(--muted); font-size:12px;">
    Read-only &nbsp;|&nbsp; auto-refresh 2s
  </span>
</header>

<main>
  <!-- Left panel: vehicle list -->
  <aside>
    <h2>Vehicles (<span id="vehCount">0</span>)</h2>
    <div id="vehList"></div>
  </aside>

  <!-- Right: top-down map canvas -->
  <canvas id="mapCanvas"></canvas>
</main>

<script>
const HOST = window.location.origin;
let _vehicles = [];
let _canvas, _ctx;
let _mapBounds = null;  // { minX, maxX, minY, maxY }

// ---------- canvas init ----------
function initCanvas() {
  _canvas = document.getElementById('mapCanvas');
  _ctx = _canvas.getContext('2d');
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);
  requestAnimationFrame(render);
}

function resizeCanvas() {
  _canvas.width  = _canvas.offsetWidth;
  _canvas.height = _canvas.offsetHeight;
}

// ---------- data fetch ----------
async function fetchVehicles() {
  try {
    const r = await fetch(`${HOST}/api/v2v/vehicles/overview`);
    if (!r.ok) { setWorldBadge(false); return; }
    _vehicles = await r.json();
    setWorldBadge(true);
    updateSidebar();
    recomputeBounds();
  } catch { setWorldBadge(false); }
}

async function fetchSessions() {
  // Show client sessions in sidebar with a different label
  // (sessions require admin token so we fall back to V2V overview only)
}

function setWorldBadge(ok) {
  const el = document.getElementById('worldBadge');
  el.textContent = ok ? 'Live' : 'Disconnected';
  el.className = 'badge ' + (ok ? 'badge-ok' : 'badge-err');
}

// ---------- sidebar ----------
function updateSidebar() {
  document.getElementById('vehCount').textContent = _vehicles.length;
  const list = document.getElementById('vehList');
  list.innerHTML = _vehicles.map(v => {
    const pos = v.bsm?.position;
    const speed = v.bsm?.speed ?? 0;
    return `<div class="veh-item">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
        <span class="veh-id">ID ${v.vehicle_id}</span>
        <span class="veh-label label-bg">vehicle</span>
      </div>
      <div class="veh-speed">${(speed * 3.6).toFixed(1)} km/h</div>
      ${pos ? `<div class="veh-pos">x=${pos.x?.toFixed(1)} y=${pos.y?.toFixed(1)}</div>` : ''}
    </div>`;
  }).join('');
}

// ---------- map rendering ----------
function recomputeBounds() {
  if (_vehicles.length === 0) return;
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  _vehicles.forEach(v => {
    const p = v.bsm?.position;
    if (!p) return;
    if (p.x < minX) minX = p.x;
    if (p.x > maxX) maxX = p.x;
    if (p.y < minY) minY = p.y;
    if (p.y > maxY) maxY = p.y;
  });
  // Add some padding
  const pad = 50;
  _mapBounds = { minX: minX - pad, maxX: maxX + pad, minY: minY - pad, maxY: maxY + pad };
}

function worldToCanvas(x, y) {
  if (!_mapBounds) return { cx: _canvas.width / 2, cy: _canvas.height / 2 };
  const { minX, maxX, minY, maxY } = _mapBounds;
  const scaleX = _canvas.width  / (maxX - minX || 1);
  const scaleY = _canvas.height / (maxY - minY || 1);
  const scale = Math.min(scaleX, scaleY) * 0.9;
  const offsetX = (_canvas.width  - (maxX - minX) * scale) / 2;
  const offsetY = (_canvas.height - (maxY - minY) * scale) / 2;
  return {
    cx: offsetX + (x - minX) * scale,
    cy: offsetY + (maxY - y) * scale,   // flip Y (CARLA Y grows southward)
  };
}

function render() {
  const ctx = _ctx;
  const W = _canvas.width, H = _canvas.height;
  ctx.clearRect(0, 0, W, H);

  // Background grid
  ctx.strokeStyle = '#1a1f2e';
  ctx.lineWidth = 1;
  const step = 60;
  for (let x = 0; x < W; x += step) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = 0; y < H; y += step) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

  // Draw vehicles
  _vehicles.forEach(v => {
    const p = v.bsm?.position;
    if (!p) return;
    const { cx, cy } = worldToCanvas(p.x, p.y);
    const speed = (v.bsm?.speed ?? 0) * 3.6;

    // Body
    ctx.beginPath();
    ctx.arc(cx, cy, 7, 0, Math.PI * 2);
    ctx.fillStyle = '#4f8ef7';
    ctx.fill();

    // Heading indicator
    const heading = (v.bsm?.heading ?? 0) * Math.PI / 180;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(heading - Math.PI/2) * 12, cy + Math.sin(heading - Math.PI/2) * 12);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Label
    ctx.fillStyle = '#e0e4f0';
    ctx.font = '10px Segoe UI, sans-serif';
    ctx.fillText(`#${v.vehicle_id}  ${speed.toFixed(0)} km/h`, cx + 10, cy - 4);

    // Threat lines
    (v.threats ?? []).forEach(t => {
      if (t.threat_level >= 2) {
        const other = _vehicles.find(o => o.vehicle_id === t.other_vehicle_id);
        if (!other?.bsm?.position) return;
        const op = worldToCanvas(other.bsm.position.x, other.bsm.position.y);
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(op.cx, op.cy);
        ctx.strokeStyle = t.threat_level >= 3 ? '#e05252' : '#f0a830';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([4, 3]);
        ctx.stroke();
        ctx.setLineDash([]);
      }
    });
  });

  requestAnimationFrame(render);
}

// ---------- init ----------
initCanvas();
fetchVehicles();
setInterval(fetchVehicles, 2000);
</script>
</body>
</html>
