# CARLA V2V Research Platform - Docker Compose
#
# Usage:
#   docker-compose up -d        # Start in background
#   docker-compose logs -f      # View logs
#   docker-compose down         # Stop and remove
#
# Access the frontend at: http://localhost:8000

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: carla-v2v-frontend
    ports:
      - "8000:8000"
    volumes:
      # Persist logs and data outside container
      - ./logs:/app/logs
      - ./data:/app/data
    environment:
      - CARLA_HOST=192.168.1.101
      - CARLA_PORT=2000
    restart: unless-stopped
    depends_on:
      - mosquitto
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: carla-mqtt-broker
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
    restart: unless-stopped

networks:
  default:
    name: carla-v2v-network
